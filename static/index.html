<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTAL Dubbing Transcriber</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div class="logo">
      <span>TTAL Transcriber</span>
      <span class="logo-badge">Studio Localhost</span>
    </div>
    <div id="header-status" style="font-size: 0.85rem; color: var(--text-muted);">
      Ready
    </div>
  </header>

  <main>
    <!-- Left Panel: Media Upload & Player -->
    <section class="left-panel">
      <div class="panel-header">
        <span>Media Input</span>
      </div>

      <div class="drop-zone" id="drop-zone">
        <strong>Drag & Drop Video Here</strong>
        <p>Supports MP4, MOV, MKV, AVI, WEBM</p>
        <input type="file" id="file-input" accept="video/*" style="display: none;">
      </div>

      <div class="media-container" id="media-container" style="display: none;">
        <video id="video-player" controls></video>
      </div>

      <div class="status-card" id="status-card">
        No video loaded. Upload a video file to begin.
      </div>
    </section>

    <!-- Right Panel: Spoken Dialogue Table Shell & Interactive Editor -->
    <section class="right-panel">
      <div class="panel-header">
        <span>Spoken Dialogue Lines</span>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn" id="transcribe-btn">Step 2: Transcribe & Diarize</button>
          
          <select id="export-format" class="select-box">
            <option value="srt">SRT Subtitle</option>
            <option value="vtt">WebVTT</option>
            <option value="csv">CSV Table</option>
            <option value="ttal">TTAL (Avid)</option>
            <option value="json">JSON Data</option>
            <option value="txt">Plain Text</option>
          </select>
          <button class="btn btn-secondary" id="export-btn" disabled>Export</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="dialogue-table">
          <thead>
            <tr>
              <th style="width: 110px;">Speaker</th>
              <th style="width: 90px;">Start (s)</th>
              <th style="width: 90px;">End (s)</th>
              <th style="width: 90px;">Duration (s)</th>
              <th>Spoken Text</th>
              <th style="width: 100px;">Actions</th>
            </tr>
          </thead>
          <tbody id="dialogue-tbody">
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  Upload video and click "Step 2: Transcribe & Diarize".
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
